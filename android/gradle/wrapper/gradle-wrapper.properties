# The wrapper jar itself is binary and is intentionally not committed.
# To obtain it once (so ./gradlew works locally), run on a machine that already
# has Gradle installed:
#
#     cd android && gradle wrapper --gradle-version 8.7
#
# CI does not need the wrapper - it installs Gradle 8.7 directly.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
